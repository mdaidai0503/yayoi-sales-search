<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>弥生販売 売上履歴検索</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#111;background:#f4f5f7}
*{box-sizing:border-box} body{margin:0}.wrap{max-width:1200px;margin:auto;padding:14px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-size:12px;color:#555;display:block}input{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px}
button{font-size:15px;padding:10px 14px;border:1px solid #999;border-radius:8px;background:#fff;cursor:pointer}
button.primary{background:#111;color:#fff;border-color:#111}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status{font-size:13px;color:#555}.summary{display:flex;gap:20px;flex-wrap:wrap;font-weight:600;margin-bottom:10px}
.tablewrap{overflow:auto;max-height:62vh;border:1px solid #ddd;border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1050px;background:#fff}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap;font-size:13px}
th{position:sticky;top:0;background:#f7f7f7;z-index:1}td.num{text-align:right}
.login{max-width:440px;margin:9vh auto}.hidden{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:8px}h1{font-size:18px}.card{padding:10px}}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>弥生販売 売上履歴検索</h1><button id="logout" class="hidden">ログアウト</button></header>

<section id="loginBox" class="card login">
<h2 style="margin-top:0;font-size:18px">ログイン</h2>
<label>メールアドレス<input id="email" type="email" autocomplete="username"></label><br>
<label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
<div class="actions"><button id="login" class="primary">ログイン</button></div>
<p id="loginMsg" class="status"></p>
</section>

<main id="app" class="hidden">
<section class="card">
<div class="grid">
<label>得意先名<input id="customer" placeholder="例：タカツキ"></label>
<label>商品名<input id="product" placeholder="商品名の一部"></label>
<label>商品コード<input id="productCode"></label>
<label>伝票番号<input id="slipNo"></label>
<label>開始日<input id="from" type="date"></label>
<label>終了日<input id="to" type="date"></label>
</div>
<div class="actions">
<button id="search" class="primary">検索</button><button id="clear">条件クリア</button><button id="printPdf" disabled>PDF印刷（条件に一致する全件）</button>
</div>
<p id="printStatus" class="status" role="status" aria-live="polite">PDF印刷 v1.1.1 を読み込み中です。この表示が続く場合は、配信ファイル一式を更新して Ctrl+F5 で再読み込みしてください。</p>
<p id="status" class="status">検索条件を入力してください。</p>
</section>

<section class="card">
<div class="summary"><span id="count">0件</span><span id="pageTotal">表示分 金額 ¥0</span></div>
<div class="tablewrap"><table>
<thead><tr><th>売上日</th><th>伝票番号</th><th>得意先</th><th>商品コード</th><th>商品名</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th></tr></thead>
<tbody id="rows"><tr><td colspan="9">検索結果はここに表示されます。</td></tr></tbody>
</table></div>
<div class="actions"><button id="prev">前へ</button><span id="pageLabel" class="status" style="align-self:center">1ページ</span><button id="next">次へ</button></div>
</section>
</main>
</div>
<script src="./print.js?v=1.1.1"></script>
<script src="./app.js?v=1.1.1"></script>
<script src="./pdf-start.js?v=1.1.1"></script>
</body></html>
